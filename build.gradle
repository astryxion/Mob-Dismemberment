plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.20.1-1.4.0'
group = 'me.ichun.mods.mobdismemberment'

base {
    archivesName = 'MobDismemberment'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                mobdismemberment {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run')
            property 'forge.enabledGameTestNamespaces', 'mobdismemberment'
        }

        server {
            // Dedicated test server. Kept out of run/ so its world, logs, and configs
            // do not overwrite the normal development client.
            workingDirectory project.file('run-dedicated')
            property 'forge.enabledGameTestNamespaces', 'mobdismemberment'
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.enabledGameTestNamespaces', 'mobdismemberment'
        }

        data {
            workingDirectory project.file('run')
            args '--mod', 'mobdismemberment', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }

        // Optional client that joins the local dedicated server as soon as the menu is ready.
        // Shares run/ with runClient — launch only one of them at a time.
        clientJoinLocal {
            parent minecraft.runs.client
            workingDirectory project.file('run')
            property 'forge.enabledGameTestNamespaces', 'mobdismemberment'
            args '--quickPlayMultiplayer', '127.0.0.1'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id     : mod_id,
            mod_name   : mod_name,
            mod_version: project.version,
            mod_license: mod_license,
            mod_authors: mod_authors,
            mod_credits: mod_credits
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    from('LICENSE')

    from sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

// Localhost-only defaults for the dedicated test server. Never overwrites an existing file
// and never writes eula=true.
def prepareDedicatedServerFiles = { File serverDir ->
    serverDir.mkdirs()
    File props = new File(serverDir, 'server.properties')
    if (!props.exists()) {
        props.setText('''# Local Mob Dismemberment test server.
# Created because this file did not exist. Later edits are left alone.
# server-ip keeps the process on this computer. Do not port-forward it.
# online-mode=false lets the Forge Gradle dev client (offline account "Dev") join.
# Connect with 127.0.0.1 so Windows does not prefer IPv6 localhost.
server-ip=127.0.0.1
server-port=25565
online-mode=false
white-list=false
enable-query=false
enable-rcon=false
gamemode=creative
force-gamemode=false
difficulty=normal
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
spawn-protection=0
allow-flight=true
enable-command-block=true
pvp=true
max-players=8
view-distance=10
simulation-distance=8
motd=Mob Dismemberment local test
level-name=world
''', 'UTF-8')
        logger.lifecycle("Created ${props}. Existing server configuration is not overwritten.")
    }

    File eula = new File(serverDir, 'eula.txt')
    boolean accepted = eula.exists() && (eula.getText('UTF-8') =~ /(?m)^\s*eula\s*=\s*true\s*$/).find()
    if (!accepted) {
        logger.warn("Minecraft EULA is not accepted. Read https://aka.ms/MinecraftEULA and set eula=true in ${eula} yourself. This build will not accept the EULA for you.")
    }
}

// ForgeGradle registers runServer during projectsEvaluated, so hook the task by name
// instead of looking it up from afterEvaluate.
tasks.configureEach { task ->
    if (task.name == 'runServer') {
        task.doFirst {
            prepareDedicatedServerFiles(project.file('run-dedicated'))
        }
    }
}
